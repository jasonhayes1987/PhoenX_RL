# =============================================================================
# Multi-modal Franka Cube Lift: proprioception + table-view RGB camera.
#
# The FIRST real multi-input IsaacSim run for the roots -> trunk -> branches
# architecture (schema reference: src/Configs/multi_modal_cfg.yml).
#
# Env observation groups (obs_key: null -> dict observation):
#   policy : (N, 36) float32   joint pos/vel (9+9), object position (3),
#                              target pose command (7), last action (8)
#   rgb    : (N, 84, 84, 3) uint8   table-view TiledCamera frames
#
# Notes vs. the state-only ppo.yml:
#   - num_envs 256 (camera rendering + uint8 rollout storage; the state-only
#     run used 4096). Rollout buffer VRAM for images:
#       24 steps * 256 envs * 84*84*3 bytes * 2 (states+next) ~= 260 MB.
#   - learn cadence preserved per-env: learn_every = 24 * 256 = 6144 steps.
#   - enable_cameras: true is REQUIRED (Kit app tiled rendering).
#   - To force vision to carry the object location (the true test), switch the
#     env cfg class to FrankaCubeLiftCameraBlindEnvCfg and change the state
#     normalizer num_features from 36 -> 33 (object_position removed).
# =============================================================================

device: &device cuda
save_dir: &save_dir E:/Documents/Programming/Projects/Reinforcement/PhoenX_RL/_tmp_smoke_cam_out/
log_level: INFO

learning_rate: &learning_rate 1.0e-4

schedule:
  stop_unit: timestep
  stop_units: &stop_units 4608
  learn_every_unit: timestep
  learn_every: 1536
  mini_batch_size: 384
  learning_epochs: 3
  seed: &seed 42

agent:
  type: PPO
  config:
    name: PPO
    model:
      device: *device
      optimizer_params: {type: Adam, params: {lr: *learning_rate}}
      # On-policy: both losses update the shared body via ONE combined
      # backward + coordinated per-module step.
      shared_update: combined
      roots:
        camera:                       # wandb: roots.camera.*
          input_keys: [rgb]
          layer_config:
            - type: conv2d
              params: {out_channels: 32, kernel_size: 3, stride: 2, padding: 1}
            - type: relu
            - type: conv2d
              params: {out_channels: 64, kernel_size: 3, stride: 2, padding: 1}
            - type: relu
            - type: conv2d
              params: {out_channels: 128, kernel_size: 3, stride: 2, padding: 1}
            - type: relu
            - type: flatten
            - type: dense             # project 128*11*11 -> compact embedding
              params: {units: 256, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
            - type: relu
        state:                        # wandb: roots.state.*
          input_keys: [policy]
          layer_config:
            - type: dense
              params: {units: 256, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
            - type: relu
            - type: dense
              params: {units: 128, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
            - type: relu
      trunk:
        layer_config:
          - type: dense
            params: {units: 256, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
          - type: relu
          - type: dense
            params: {units: 128, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
          - type: relu
      branches:
        policy:
          type: StochasticContinuousHead
          distribution: normal
          layer_config:
            - type: dense
              params: {units: 64, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
            - type: relu
          output_config:
            - type: dense
              params: {kernel: orthogonal, kernel_params: {gain: 0.01}}
        value:
          type: ValueHead
          layer_config:
            - type: dense
              params: {units: 64, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
            - type: relu
          output_config:
            - type: dense
              params: {kernel: orthogonal, kernel_params: {gain: 1.0}}
    discount: 0.98
    gae_coefficient: 0.95
    state_normalizer:
      type: DictNormalizer
      config:
        name: PPO.StateNormalizer
        per_key:
          # Proprio state normalized; 'rgb' passes through (uint8 frames are
          # auto-scaled to [0,1] floats at the model input boundary).
          policy: {type: RunningNorm, config: {num_features: 36, clip_value: 5.0, min_std: 1.0e-2}}
        device: *device
    advantage_normalizer:
      type: BatchNorm
      config:
        name: PPO.AdvantageNormalizer
        clip_value: 10.0
        device: *device
    entropy_coefficient: 0.006
    auto_entropy_tuning: false
    kl_coefficient: 0.0
    kl_adapter:
      initial_beta: 0.0
      target_kl: 0.01
      scale_up: 2.0
      scale_down: 0.5
      kl_tolerance_high: 1.5
      kl_tolerance_low: 0.5
    policy_clip: 0.2
    policy_grad_clip: 1.0
    value_clip: 0.2
    value_grad_clip: 1.0
    value_coef: 1.0
    reward_clip: .inf
    bootstrap_truncations: true

env:
  type: isaacsim
  config:
    cfg: "Configs.IsaacSim.franka.cube_lift.custom_franka_cube_lift_cfg:FrankaCubeLiftCameraEnvCfg"
    num_envs: 64
    obs_key: null                # expose ALL observation groups as a dict
    goal_key: null
    ach_goal_key: null
    wrappers: []
    render_mode: headless
    seed: *seed
    enable_cameras: true         # REQUIRED for camera sensors

buffer:
  type: RolloutBuffer
  config:
    buffer_size: 24
    device: *device



