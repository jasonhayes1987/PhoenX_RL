# SAC config template

device: &device cuda
save_dir: &save_dir E:/Documents/Programming/Projects/Reinforcement/PhoenX_RL/src/Trained_Models/LunarLanderContinuous-v3_b/SAC/
log_level: INFO

schedule:
  stop_unit: timestep
  stop_units: &stop_units 1000000
  learn_every_unit: timestep
  learn_every: 1
  updates_per_learn: 1
  batch_size: 256
  warmup_steps: 1000
  seed: &seed 42

agent:
  type: SAC
  config:
    name: SAC
    policy:
      layer_config:
        - type: dense
          params: {units: 400, kernel: default, kernel_params: {}}
        - type: relu
        - type: dense
          params: {units: 300, kernel: default, kernel_params: {}}
        - type: relu
      output_config:
        - type: dense
          params: {kernel: default, kernel_params: {}}
      optimizer_params: {type: Adam, params: {lr: &policy_lr 0.0003}}
      # lr_scheduler:
      #   schedule_type: "linear"
      #   steps: *stop_units
      #   start_value: *policy_lr
      #   end_value: 1.0e-5
      distribution: normal
      # temperature: &temperature 1.0 # Categorical dist only
      device: *device
    critic:
      layer_config:
        - type: dense
          params: {units: 400, kernel: default, kernel_params: {}}
        - type: relu
      merged_config:
        - type: dense
          params: {units: 300, kernel: default, kernel_params: {}}
        - type: relu
      output_config:
        - type: dense
          params: {kernel: default, kernel_params: {}}
      optimizer_params: {type: Adam, params: {lr: &critic_lr 0.0003}}
      # lr_scheduler:
      #   schedule_type: "linear"
      #   steps: *stop_units
      #   start_value: *critic_lr
      #   end_value: 1.0e-5
      device: *device
    discount: 0.99
    tau: 0.01
    state_normalizer:
      type: RunningNorm
      config:
        name: SAC.StateNormalizer
        clip_value: 10.0
        device: *device
        log_level: DEBUG
        # kwargs
        _diag_freq: 1000
    # reward_normalizer:
    #   type: RewardNorm
    #   config:
    #     name: SAC.RewardNormalizer
    #     gamma: 0.99
    #     clip_value: 5.0
    #     device: *device
    #     log_level: DEBUG
    #     # kwargs
    #     _diag_freq: 1000
    # entropy_coefficient: &entropy_coefficient 0.00
    # entropy_schedule:
    #   schedule_type: "cosine"
    #   steps: *stop_units
    #   start_value: *entropy_coefficient
    #   end_value: 0.01
    auto_entropy_tuning: true
    entropy_lr: 0.001
    target_entropy_scale: 1.0
    policy_grad_clip: 10.0
    critic_grad_clip: 10.0
    critic_huber_delta: 1.0
    N: &n 1
