# SAC tuned for LunarLanderContinuous-v3

device: &device cuda
save_dir: &save_dir ./Trained_Models/LunarLanderContinuous-v3/SAC/
log_level: INFO

schedule:
  stop_unit: timestep
  stop_units: &stop_units 1000000
  learn_every_unit: timestep
  learn_every: 64
  updates_per_learn: 1
  batch_size: 2048
  warmup_steps: 10000
  seed: &seed 42

agent:
  type: SAC
  config:
    discount: 0.99
    tau: 0.01
    entropy_coefficient: 1.0
    auto_entropy_tuning: true
    entropy_lr: 0.0003
    policy_grad_clip: 1.0
    critic_grad_clip: 1.0
    N: &n 1
    log_level: DEBUG
    _diag_freq: 1000

env:
  type: envpool
  config:
    cfg: LunarLanderContinuous-v3
    num_envs: 64
    obs_key: &obs_key null
    goal_key: &goal_key null
    ach_goal_key: &ach_goal_key null
    wrappers: [{"type": "VectorNStepReward", "params": {"n": *n, "obs_key": *obs_key, "goal_key": *goal_key, "ach_goal_key": *ach_goal_key}}]
    render_mode: null
    seed: *seed

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 400, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 300, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &policy_lr 0.00073}}
    distribution: normal
    device: *device

  critic:
    layer_config:
      - type: dense
        params: {units: 400, kernel: default, kernel_params: {}}
      - type: relu
    merged_config:
      - type: dense
        params: {units: 300, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &critic_lr 0.00073}}
    device: *device

  critic_b:
    layer_config:
      - type: dense
        params: {units: 400, kernel: default, kernel_params: {}}
      - type: relu
    merged_config:
      - type: dense
        params: {units: 300, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &critic_b_lr 0.00073}}
    device: *device

policy_lr_schedule:
  schedule_type: "linear"
  steps: *stop_units
  start_value: *policy_lr
  end_value: 0.0

critic_lr_schedule:
  schedule_type: "linear"
  steps: *stop_units
  start_value: *critic_lr
  end_value: 0.0

critic_b_lr_schedule:
  schedule_type: "linear"
  steps: *stop_units
  start_value: *critic_b_lr
  end_value: 0.0

normalizers:
  state:
    type: RunningNorm
    config:
      clip_value: 10.0
      device: *device
      log_level: DEBUG
      _diag_freq: 10000

buffer:
  type: PrioritizedReplayBuffer
  config:
    buffer_size: 100000
    alpha: 0.6
    beta_start: 0.4
    beta_iter: 100000
    beta_update_freq: 10
    priority: proportional
    epsilon: 1.0e-6
    sort_freq: 1000
    N: *n
    device: *device

# buffer:
#   type: ReplayBuffer
#   config:
#     buffer_size: 1000000
#     N: *n
#     device: *device

renderer:
  render_freq: 500
  save_dir: *save_dir

callbacks:
  - type: "WandbCallback"
    config: {project_name: "LunarLanderContinuous-v3"}
