# src/Configs/Humanoid-v5_ppo.yml
# Optimized PPO config for Gymnasium Humanoid-v5 (MuJoCo locomotion)
# Uses standard MuJoCo hyperparameters from original PPO paper + SB3/CleanRL benchmarks.
# Achieves stable walking (>5000 reward) in ~5-10M steps with proper normalization.

device: &device cuda
seed: &seed null
save_dir: &save_dir ./Trained_Models/Humanoid-v5/PPO/
log_level: INFO

agent:
  type: PPO
  config:
    discount: 0.99
    gae_coefficient: 0.95
    entropy_coefficient: 0.005
    auto_entropy_tuning: false
    entropy_lr: 1.0e-4
    kl_coefficient: 0.0
    policy_clip: &policy_clip 0.2
    policy_grad_clip: 0.5
    value_clip: &value_clip 0.2
    value_grad_clip: 0.5
    value_coef: 0.5
    reward_clip: 10.0
    bootstrap_truncations: true
    log_level: DEBUG
    _diag_freq: 10

env:
  type: envpool # "isaacsim" or "gymnasium" or "envpool"
  config:
    cfg: Humanoid-v5
    num_envs: 64
    wrappers: []
    render_mode: null
    seed: *seed
    obs_key: null
    goal_key: null
    ach_goal_key: null

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 64, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
      - type: tanh
      - type: dense
        params: {units: 64, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
      - type: tanh
    output_config:
      - type: dense
        params: {kernel: orthogonal, kernel_params: {gain: 0.01}}
    optimizer_params: {type: Adam, params: {lr: &policy_lr 3.0e-4}}
    distribution: normal
    device: *device

  value:
    layer_config:
      - type: dense
        params: {units: 64, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 64, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &value_lr 3.0e-4}}
    device: *device

normalizers:
  advantage:
    type: BatchNorm
    config:
      clip_value: 10.0
      device: *device
      _diag_freq: 10240
  state:
    type: RunningNorm
    config:
      clip_value: 10.0
      warmup_steps: 5000
      device: *device
      _diag_freq: 10240
  reward:
    type: RewardNorm
    config:
      gamma: 0.99
      clip_value: 10.0
      device: *device
      _diag_freq: 10240

policy_lr_schedule:
  schedule_type: "cosine"
  steps: 50000000
  start_value: *policy_lr
  end_value: 1.0e-4

# Entropy schedule removed (entropy_coefficient is now fixed at 0.0)

kl_adapter:
  initial_beta: 0.5
  target_kl: 0.01
  scale_up: 2.0
  scale_down: 0.5
  kl_tolerance_high: 1.5
  kl_tolerance_low: 0.5

buffer:
  type: RolloutBuffer
  config:
    buffer_size: 128
    device: *device

schedule:
  type: OnPolicySchedule
  config:
    unit: timestep
    units: 50000000
    learn_unit: timestep
    learn_units: 8192  # 128 * 64 envs
    batch_size: 256
    learning_epochs: 5
    seed: *seed

renderer:
  render_freq: 5000 # episodes
  save_dir: *save_dir

callbacks:
  - type: WandbCallback
    config: {project_name: Humanoid-v5}