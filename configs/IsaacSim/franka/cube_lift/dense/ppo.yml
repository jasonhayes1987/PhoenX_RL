

device: &device cuda
save_dir: &save_dir E:/Documents/Programming/Projects/Reinforcement/PhoenX_RL/src/Trained_Models/IsaacSim/Franka/CubeLift/PPO_1/
log_level: INFO

schedule:
  stop_unit: timestep
  stop_units: &stop_units 147456000
  learn_every_unit: timestep
  learn_every: 98304
  mini_batch_size: 24576
  learning_epochs: 5
  seed: &seed 42

agent:
  type: PPO
  config:
    name: PPO
    policy:
      layer_config:
        - type: dense
          params: {units: 256, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
        - type: dense
          params: {units: 128, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
        - type: dense
          params: {units: 64, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
      output_config:
        - type: dense
          params: {kernel: orthogonal, kernel_params: {gain: 0.01}}
      optimizer_params: {type: Adam, params: {lr: &policy_lr 1.0e-4}}
      distribution: normal
      device: *device
    value:
      layer_config:
        - type: dense
          params: {units: 256, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
        - type: dense
          params: {units: 128, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
        - type: dense
          params: {units: 64, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
      output_config:
        - type: dense
          params: {kernel: orthogonal, kernel_params: {gain: 1.0}}
      optimizer_params: {type: Adam, params: {lr: &value_lr 1.0e-4}}
      device: *device
    discount: 0.98
    gae_coefficient: 0.95
    state_normalizer:
      type: RunningNorm
      config:
        name: PPO.StateNormalizer
        clip_value: 5.0
        device: *device
        # log_level: DEBUG
        # _diag_freq: 10000
    advantage_normalizer:
      type: BatchNorm
      config:
        name: PPO.AdvantageNormalizer
        clip_value: 10.0
        device: *device
        # log_level: DEBUG
        # _diag_freq: 10000
    # reward_normalizer:
    #   type: RewardNorm
    #   config:
    #     name: PPO.RewardNormalizer
    #     gamma: 0.98
    #     clip_value: 10.0
    #     device: *device
    entropy_coefficient: &entropy_coefficient 0.006
    # entropy_schedule:
    #   schedule_type: linear
    #   steps: *stop_units
    #   start_value: *entropy_coefficient
    #   end_value: 0.001
    auto_entropy_tuning: false
    # entropy_lr: 3.0e-4
    # target_entropy_scale: 0.98
    kl_coefficient: 0.0
    # Early-stop epochs when KL exceeds 1.5x target (RSL-RL adaptive schedule analogue)
    kl_adapter:
      initial_beta: 0.0
      target_kl: 0.01
      scale_up: 2.0
      scale_down: 0.5
      kl_tolerance_high: 1.5
      kl_tolerance_low: 0.5
    policy_clip: &policy_clip 0.2
    # policy_clip_schedule:
    #   schedule_type: linear
    #   steps: *stop_units
    #   start_value: *policy_clip
    #   end_value: 0.01
    policy_grad_clip: 1.0
    value_clip: &value_clip 0.2
    # value_clip_schedule:
    #   schedule_type: linear
    #   steps: *stop_units
    #   start_value: *value_clip
    #   end_value: 0.01
    value_grad_clip: 1.0
    value_coef: 1.0
    reward_clip: .inf
    bootstrap_truncations: true
