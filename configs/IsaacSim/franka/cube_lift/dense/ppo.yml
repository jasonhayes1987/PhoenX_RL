env:
  type: isaacsim
  config:
    cfg: "Configs.IsaacSim.franka.cube_lift.custom_franka_cube_lift_cfg:FrankaCubeLiftEnvCfg_Custom_Limits"
    num_envs: 4096
    obs_key: &obs_key policy
    goal_key: &goal_key null
    ach_goal_key: &ach_goal_key null
    wrappers: []
    render_mode: headless
    seed: *seed

buffer:
  type: RolloutBuffer
  config:
    buffer_size: 24
    device: *device

