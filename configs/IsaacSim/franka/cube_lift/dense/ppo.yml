    #               {'type': 'dense', 'params': {units: 64, kernel: variance_scaling, kernel_params:{scale: 1.0, mode: fan_in, distribution: uniform}}},
    #               {'type': 'relu'},
    #           ],
    #           'output_layer': [
    #               {'type': 'dense', 'params': {kernel: variance_scaling, kernel_params:{scale: 1.0, mode: fan_in, distribution: uniform}}}
    #           ]
