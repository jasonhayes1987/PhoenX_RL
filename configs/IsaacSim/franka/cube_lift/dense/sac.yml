env:
  type: isaacsim
  config:
    cfg: "Configs.IsaacSim.franka.cube_lift.custom_franka_cube_lift_cfg:FrankaCubeLiftEnvCfg_Custom_Limits"
    num_envs: 4096
    obs_key: &obs_key policy
    goal_key: &goal_key null
    ach_goal_key: &ach_goal_key null
    wrappers: [{"type": "VectorNStepReward", "params": {"n": *n, "obs_key": *obs_key, "goal_key": *goal_key, "ach_goal_key": *ach_goal_key}}]
    render_mode: headless
    seed: *seed

buffer:
  type: PrioritizedReplayBuffer
  config:
    buffer_size: 10000000
    alpha: 0.6
    beta_start: 0.4
    beta_iter: 500000
    priority: rank
    sort_freq: 4096
    epsilon: 1.0e-6
    N: *n
    # hindsight:
    #   strategy: future
    #   num_goals: 4
