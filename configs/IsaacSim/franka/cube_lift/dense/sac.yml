# SAC tuned for IsaacSim franka cube lift env

device: &device cuda
save_dir: &save_dir E:/Documents/Programming/Projects/Reinforcement/PhoenX_RL/src/Trained_Models/IsaacSim/Franka/CubeLift/SAC_1/
log_level: INFO

schedule:
  stop_unit: timestep
  stop_units: &stop_units 50000000
  learn_every_unit: timestep
  learn_every: 4096
  updates_per_learn: 1
  batch_size: 4096
  warmup_steps: 20000
  seed: &seed 42

agent:
  type: SAC
  config:
    name: SAC
    policy:
      layer_config:
        # - type: dense
        #   params: {units: 512, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
        # - type: relu
        # - type: dense
        #   params: {units: 256, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
        # - type: relu
        - type: dense
          params: {units: 256, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
        - type: dense
          params: {units: 128, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
        - type: dense
          params: {units: 64, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
      output_config:
        # - type: dense
        #   params: {kernel: uniform, kernel_params: {a: -3.0e-3, b: 3.0e-3}}
        - type: dense
          params: {kernel: orthogonal, kernel_params: {gain: 0.01}}
      optimizer_params: {type: Adam, params: {lr: &policy_lr 0.000728}}
      distribution: normal
      device: *device
    critic:
      layer_config: []
      merged_config:
        # - type: dense
        #   params: {units: 512, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
        # - type: relu
        # - type: dense
        #   params: {units: 256, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
        # - type: relu
        - type: dense
          params: {units: 256, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
        - type: dense
          params: {units: 128, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
        - type: dense
          params: {units: 64, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
        - type: relu
      output_config:
        # - type: dense
        #   params: {kernel: uniform, kernel_params: {a: -3.0e-3, b: 3.0e-3}}
        - type: dense
          params: {kernel: orthogonal, kernel_params: {gain: 1.0}}
      optimizer_params: {type: Adam, params: {lr: &critic_lr 0.000728}}
      device: *device
    discount: 0.98
    tau: 0.05
    state_normalizer:
      type: RunningNorm
      config:
        name: SAC.StateNormalizer
        clip_value: 5.0
        device: *device
        # log_level: DEBUG
        # _diag_freq: 10000
    # reward_normalizer:
    #   type: RewardNorm
    #   config:
    #     name: SAC.RewardNormalizer
    #     gamma: 0.99
    #     clip_value: 10.0
    #     device: *device
    #     # log_level: DEBUG
    #     # kwargs
    #     # _diag_freq: 10240
    entropy_coefficient: &entropy_coefficient 0.006
    entropy_schedule:
      schedule_type: linear
      steps: *stop_units
      start_value: *entropy_coefficient
      end_value: 0.001
    auto_entropy_tuning: false
    # entropy_lr: 3.0e-3
    # target_entropy_scale: 0.98
    policy_grad_clip: 40.0
    critic_grad_clip: 40.0
    critic_huber_delta: 1.0
    N: &n 1
