[tool.poetry]
name = "phoenx_rl"
version = "0.1.0"
description = "PhoenX Reinforcement Learning framework with IsaacLab integration"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"  # Matches your LICENSE file
readme = "README.md"
repository = "https://github.com/yourusername/phoennx_rl"  # Optional: Add if you have a repo
keywords = ["reinforcement-learning", "rl", "isaaclab", "gymnasium", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
# Moved from yml (pure Python or wheels)
pylint = "^3.2.0"
pytest = "^7.4.0"
umap-learn = "^0.5.5"
pynndescent = "^0.5.12"
astunparse = "^1.6.3"
hypothesis = "^6.1.0"
psutil = "^6.0.0"
pyyaml = "^6.0.1"
requests = "^2.31.0"
setuptools = "^70.0.0"
typing-extensions = ">=4.8.0"
numpy = "^1.26.4"
pandas = "^2.2.3"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"
scikit-learn = "^1.5.2"
sympy = "^1.13.0"
filelock = "^3.15.0"
networkx = "^3.3.0"
jinja2 = "^3.1.0"
fsspec = "^2024.6.0"
packaging = "^24.1"
lark = "^1.2.0"
ale-py = "^0.9.0"
flask = "^3.0.0"
dash = "^2.17.0"
natsort = "^8.4.0"
dash-bootstrap-components = "^1.6.0"
python-dotenv = "^1.0.0"
ray = {extras = ["tune", "default"], version = "^2.10.0"}  # ray-all
optuna = "^3.6.0"
hyperopt = "^0.2.7"
ipywidgets = "^8.1.0"
decorator = "==4.0.2"
expecttest = "^0.3.0"
optree = ">=0.9.1"
wandb = "^0.17.0"
gymnasium = {extras = ["all"], version = "==1.1.0"}

# Specials: Install manually after Poetry (see installation steps)
# torch = "==2.7.0"  # pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cu128
# torchvision = "==0.22.0"  # Same
# isaaclab = {version = "==2.3.0", extras = ["isaacsim", "all"]}  # pip install isaaclab[isaacsim,all]==2.3.0 --extra-index-url https://pypi.nvidia.com
# gymnasium-robotics = {git = "https://github.com/Farama-Foundation/Gymnasium-Robotics.git", tag = "v1.4.0"}  # pip install git+https://github.com/Farama-Foundation/Gymnasium-Robotics.git@v1.4.0

[tool.poetry.group.dev.dependencies]  # Development dependencies (testing, linting)
pytest = "^7.4.0"
black = "^24.4.0"  # Code formatter
isort = "^5.13.0"  # Import sorter
pylint = "^3.2.0"  # Linter
pytest-cov = "^5.0.0"  # Test coverage
notebook = "^7.1.0"  # For Jupyter

[build-system]  # Build backend (Poetry handles this automatically)
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]  # Optional: Entry points for CLI scripts (e.g., run your train.py)
train = "phoenx_rl.app.train:main"  # Assumes you add a main() to train.py; run with `poetry run train`

[[tool.poetry.packages]]  # Explicit package discovery (points to src/)
include = "phoenx_rl"
from = "src"

[tool.black]  # Formatter config
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]  # Import sorter config
profile = "black"
line_length = 88

[tool.pytest.ini_options]  # Test runner config
minversion = "6.0"
addopts = "-ra --strict-markers"
testpaths = ["tests", "src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"