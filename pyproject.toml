[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenx-rl"
version = "0.1.0"
description = "PhoenX Reinforcement Learning framework"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "Jason Hayes" }]
keywords = ["reinforcement-learning", "rl", "isaaclab", "gymnasium", "pytorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.5",
  "numpy>=1.26",
  "gymnasium[mujoco,atari,box2d,classic-control,toy-text,other]==1.2.0",
  "gymnasium-robotics>=1.4.0",
  "ale-py>=0.9",
  "envpool>=1.0.1; sys_platform == 'linux'",
  "ray[tune,default]>=2.10",
  "optuna>=3.6",
  "hyperopt>=0.2.7",
  "wandb>=0.27",
  "pyyaml>=6.0.1",
  "opencv-python==4.11.0.86",
  "pandas>=2.2.3",
  "matplotlib>=3.9.2",
  "seaborn>=0.13.2",
  "scikit-learn>=1.5.2",
  "umap-learn>=0.5.5",
  "python-dotenv>=1.0",
  "natsort>=8.4",
  "requests>=2.31",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4", "pytest-cov>=5.0", "hypothesis>=6.1",
  "black>=24.4", "isort>=5.13", "pylint>=3.2", "notebook>=7.1",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
phoenx-train = "phoenx.cli.train:main"
phoenx-test  = "phoenx.cli.test:main"

[project.urls]
Repository = "https://github.com/jasonhayes1987/PhoenX_RL"
Documentation = "https://jasonhayes1987.github.io/PhoenX_RL"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "isaac: integration tests that boot a real Isaac Sim / isaaclab environment (GPU required)",
  "slow: long-running tests, e.g. stepping a real env to an episode boundary",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88