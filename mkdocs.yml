site_name: PhoenX RL
site_description: Documentation for the PhoenX RL framework
repo_url: https://github.com/jasonhayes1987/PhoenX_RL

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            members_order: source
            show_if_no_docstring: true

markdown_extensions:
  - pymdownx.snippets:
      check_paths: true   # changelog include; run mkdocs from the repo root
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tilde
  - pymdownx.critic

nav:
  - Home: index.md
  - How-To Guides:
      - Installation: how-to/installation.md            # snippet include of root installation.md
      - Getting Started: how-to/getting-started.md      # phoenx-train / phoenx-test CLI usage
      - Configuration Files: how-to/configurations.md   # YAML schema, bundled examples, config resolution
      - The PhoenX Window: how-to/window.md         # desktop window, installer limit, doctor
      - Metrics Reference: how-to/metrics-reference.md  # the logged metrics, what they measure, how to read them
      - Hyperparameter Sweeps: how-to/hyperparameter-sweeps.md  # phoenx-tune multi-phase Ray Tune sweeps
      - Isaac Sim Environments: how-to/isaac-sim.md     # custom cfg .py files
  - Decisions:
      - Index: decisions/index.md
      - 0001 Python form: decisions/0001-session-uses-the-python-form.md
      - 0002 Five pages: decisions/0002-five-sidebar-pages.md
      - 0003 Empty pages: decisions/0003-empty-dashboard-and-settings.md
      - 0004 Open on an editor: decisions/0004-open-on-the-editor.md
      - 0005 Brand folder: decisions/0005-one-brand-folder.md
      - 0006 Amber means live: decisions/0006-amber-means-live.md
      - 0007 Header status: decisions/0007-header-is-the-run-word.md
      - 0008 Questions in Python: decisions/0008-questions-stay-in-python.md
      - 0009 One Python process: decisions/0009-one-python-process.md
      - 0010 Old window overlap: decisions/0010-tkinter-until-the-window-existed.md
      - 0011 Installer limit: decisions/0011-installer-does-not-include-python.md
      - 0012 Desktop tree: decisions/0012-desktop-code-is-reviewed-with-the-rest.md
      - 0013 Vitest: decisions/0013-vitest-for-the-screen.md
      - 0014 Stable Rust: decisions/0014-official-stable-rust.md
      - 0015 Visible-page shortcuts: decisions/0015-shortcuts-follow-the-visible-page.md
      - 0016 The command waits: decisions/0016-the-command-waits.md
