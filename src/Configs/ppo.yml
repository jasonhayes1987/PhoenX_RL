buffer:
  type: RolloutBuffer
  config:
    buffer_size: 1024
    device: *device

schedule:
  type: OnPolicySchedule
  config:
    unit: timestep
    num_units: 2000000
    learn_unit: timestep
    num_learn_units: 16384 # 1024 * 16
    batch_size: 64
    learning_epochs: 4
    seed: *seed

renderer:
  render_freq: 1000
  save_dir: *save_dir

callbacks:
  - type: WandbCallback
    config: {project_name: LunarLanderContinuous-v3}