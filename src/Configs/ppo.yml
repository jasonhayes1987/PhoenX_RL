#TODO: Add learning rate schedulers

device: &device cuda
seed: &seed null
save_dir: &save_dir E:/Documents/Programming/Projects/Reinforcement/PhoenX_RL/src/Trained_Models/LunarLanderContinuous-v3_test/PPO/
log_level: INFO

agent:
  type: PPO
  config:
    discount: 0.999
    gae_coefficient: 0.98
    entropy_coefficient: &entropy_coefficient 0.01
    auto_entropy_tuning: false
    entropy_lr: 1.0e-2
    kl_coefficient: 0.0
    policy_clip: &policy_clip 0.2
    policy_grad_clip: 0.5
    value_clip: &value_clip 0.2
    value_grad_clip: 0.5
    value_coef: 0.5
    reward_clip: .inf
    bootstrap_truncations: true
    log_level: INFO
    _diag_freq: null

env:
  type: gymnasium # "isaacsim" or "gymnasium"
  config:
    # cfg: "isaaclab_tasks.manager_based.classic.cartpole.cartpole_env_cfg:CartpoleEnvCfg"
    cfg: LunarLanderContinuous-v3
    num_envs: 16
    # wrappers: [{"type": "OneHotObservationWrapper", "params": {}}]
    wrappers: []
    render_mode: null
    seed: *seed
    obs_key: null
    goal_key: null
    ach_goal_key: null

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 128, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 64, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: 3.0e-4}}
    distribution: normal
    # temperature: &temperature 1.0
    device: *device

  value:
    layer_config:
      - type: dense
        params: {units: 128, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 64, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: 3.0e-4}}
    device: *device

normalizers:
  advantage:
    type: BatchNorm
    config:
      clip_value: 10.0
      device: *device
      log_level: INFO
      # kwargs
      # _diag_freq: 4096
  state:
    type: RunningNorm
    config:
      clip_value: 10.0
      warmup_steps: 1000
      device: *device
      log_level: INFO
      # kwargs
      # _diag_freq: 4096
  reward:
    type: RewardNorm
    config:
      gamma: 0.99
      clip_value: 10.0
      device: *device
      log_level: INFO
      # kwargs
      _diag_freq: 1024

