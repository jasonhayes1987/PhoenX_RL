#   start_value: *critic_lr
#   end_value: 0.0

# critic_b_lr_schedule:
#   schedule_type: "linear"
#   steps: *stop_units
#   start_value: *critic_b_lr
#   end_value: 0.0

normalizers:
  state:
    type: RunningNorm
    config:
      clip_value: 10.0
      device: *device
      log_level: DEBUG
      _diag_freq: 10000
  # reward:
  #   type: RewardNorm
  #   config:
  #     gamma: 0.99
  #     clip_value: 10.0
  #     device: *device
  #     log_level: DEBUG
  #     # kwargs
  #     _diag_freq: 10240

buffer:
  type: PrioritizedReplayBuffer
  config:
    buffer_size: 100000
    alpha: 0.6
    beta_start: 0.4
    beta_iter: 100000
    beta_update_freq: 10
    priority: proportional
    epsilon: 1.0e-6
    sort_freq: 1000
    N: *n
    device: *device

# buffer:
#   type: ReplayBuffer
#   config:
#     buffer_size: 100000
#     N: *n
#     device: *device

renderer:
  render_freq: 500
  save_dir: *save_dir

callbacks:
  - type: "WandbCallback"
    config: {project_name: "LunarLander-v3"}
