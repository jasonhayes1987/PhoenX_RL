# SAC tuned for LunarLander-v3

device: &device cuda
save_dir: &save_dir ./Trained_Models/LunarLander-v3/SAC/
log_level: INFO

schedule:
  stop_unit: timestep
  stop_units: &stop_units 1000000
  learn_every_unit: timestep
  learn_every: 64
  updates_per_learn: 5
  batch_size: 256
  warmup_steps: 5000
  seed: &seed 42

agent:
  type: SAC
  config:
    discount: 0.99
    tau: 0.005
    entropy_coefficient: 0.01
    auto_entropy_tuning: true
    entropy_lr: 0.0003
    target_entropy_scale: 0.2
    policy_grad_clip: 40.0
    critic_grad_clip: 40.0
    N: &n 5
    log_level: DEBUG
    _diag_freq: 1000

env:
  type: envpool
  config:
    cfg: LunarLander-v3
    num_envs: 64
    obs_key: &obs_key null
    goal_key: &goal_key null
    ach_goal_key: &ach_goal_key null
    wrappers: [{"type": "VectorNStepReward", "params": {"n": *n, "obs_key": *obs_key, "goal_key": *goal_key, "ach_goal_key": *ach_goal_key}}]
    render_mode: null
    seed: *seed

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &policy_lr 0.0003}}
    distribution: categorical
    temperature: &temperature 1.0
    device: *device

  critic:
    layer_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &critic_lr 0.0003}}
    device: *device

  critic_b:
    layer_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &critic_b_lr 0.0003}}
    device: *device

# policy_lr_schedule:
#   schedule_type: "linear"
#   steps: *stop_units
#   start_value: *policy_lr
#   end_value: 0.0

# critic_lr_schedule:
#   schedule_type: "linear"
