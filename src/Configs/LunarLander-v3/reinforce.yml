device: &device cuda
seed: &seed null
save_dir: &save_dir "E:/Documents/Programming/Projects/Reinforcement/PhoenX_RL/src/Trained_Models/LunarLander-v3_test/Reinforce/"
log_level: INFO

agent:
  type: Reinforce
  config:
    discount: 0.99
    entropy_coefficient: &entropy_coefficient 0.01
    auto_entropy_tuning: false
    entropy_lr: 1.0e-2
    log_level: INFO
    _diag_freq: 10

env:
  type: gymnasium # "isaacsim" or "gymnasium"
  config:
    # cfg: "isaaclab_tasks.manager_based.classic.cartpole.cartpole_env_cfg:CartpoleEnvCfg"
    cfg: LunarLander-v3
    num_envs: 8
    # wrappers: [{"type": "OneHotObservationWrapper", "params": {}}]
    wrappers: []
    render_mode: null
    seed: *seed
    obs_key: null
    goal_key: null
    ach_goal_key: null

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 64, kernel: orthogonal, kernel_params: {gain: 2.0}}
      # - type: relu
      - type: dense
        params: {units: 32, kernel: orthogonal, kernel_params: {gain: 2.0}}
      # - type: relu
    output_config:
      - type: dense
        params: {kernel: orthogonal, kernel_params: {gain: 2.0}}
    optimizer_params: {type: Adam, params: {lr: 0.001}}
    distribution: categorical
    temperature: &temperature 1.0
    device: *device

  value:
    layer_config:
      - type: dense
        params: {units: 64, kernel: orthogonal, kernel_params: {gain: 2.0}}
      # - type: relu
      - type: dense
        params: {units: 32, kernel: orthogonal, kernel_params: {gain: 2.0}}
      # - type: relu
    output_config:
      - type: dense
        params: {kernel: orthogonal, kernel_params: {gain: 2.0}}
    optimizer_params: {type: Adam, params: {lr: 0.0001}}
    device: *device

normalizers:
  advantage:
    type: BatchNorm
    config:
      clip_value: 10.0
      device: *device
      log_level: INFO
      # kwargs
      _diag_freq: 1024
  state:
    type: RunningNorm
    config:
      clip_value: 10.0
      warmup_steps: 1000
      device: *device
      log_level: INFO
      # kwargs
      _diag_freq: 1024
  reward:
    type: RewardNorm
    config:
      gamma: 0.99
      clip_value: 10.0
      device: *device
      log_level: INFO
      # kwargs
      _diag_freq: 1024

# entropy_schedule:
#   schedule_type: "linear"
#   steps: 100000
#   start_value: *entropy_coefficient
#   end_value: 0.001

# temperature_schedule:
#   schedule_type: "cosine"
#   steps: 500000
#   start_value: *temperature
#   end_value: 1.0

buffer:
  type: TrajectoryBuffer
  config:
    buffer_size: 1000
    device: *device

schedule:
  type: OnPolicySchedule
  config:
    unit: timestep
    num_units: 500000
    learn_unit: trajectory
    num_learn_units: 10
    seed: *seed

renderer:
  render_freq: 1000 # episodes
  save_dir: *save_dir

callbacks:
  - type: WandbCallback
    config: {project_name: LunarLander-v3}