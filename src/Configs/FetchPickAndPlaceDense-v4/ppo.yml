# src/Configs/FetchPickAndPlace_ppo.yml
# Adapted PPO config for Gymnasium Robotics FetchPickAndPlace-v2
# Note: PPO may still struggle due to sparse rewards. Consider HER + off-policy (TD3/SAC/TQC) for better results.
# Uses larger networks, goal-key handling, more parallel envs, and longer training.

device: &device cuda
seed: &seed null
save_dir: &save_dir ./Trained_Models/FetchPickAndPlaceDense-v4/PPO/
log_level: INFO

agent:
  type: PPO
  config:
    discount: 0.99
    gae_coefficient: 0.95
    entropy_coefficient: &entropy_coefficient 0.01
    auto_entropy_tuning: false
    entropy_lr: 1.0e-4
    kl_coefficient: 0.0
    policy_clip: &policy_clip 0.2
    policy_grad_clip: 0.5
    value_clip: &value_clip 0.2
    value_grad_clip: 0.5
    value_coef: 0.5
    reward_clip: 10.0
    bootstrap_truncations: true
    log_level: INFO
    _diag_freq: 50

env:
  type: gymnasium
  config:
    cfg: FetchPickAndPlaceDense-v4
    num_envs: 32
    wrappers: []
    render_mode: null
    seed: *seed
    obs_key: observation
    goal_key: desired_goal
    ach_goal_key: achieved_goal

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &policy_lr 3.0e-4}}
    distribution: normal
    device: *device

  value:
    layer_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &value_lr 3.0e-4}}
    device: *device

normalizers:
  advantage:
    type: BatchNorm
    config:
      clip_value: 10.0
      device: *device
      _diag_freq: 10240
  state:
    type: RunningNorm
    config:
      clip_value: 10.0
      warmup_steps: 5000
      device: *device
      _diag_freq: 10240
  reward:
    type: RewardNorm
    config:
      gamma: 0.99
      clip_value: 10.0
      device: *device
      _diag_freq: 10240

policy_lr_schedule:
  schedule_type: "linear"
  steps: 5000000
  start_value: *policy_lr
  end_value: 1.0e-5

entropy_schedule:
  schedule_type: "cosine"
  steps: 5000000
  start_value: *entropy_coefficient
  end_value: 0.001

kl_adapter:
  initial_beta: 0.5
  target_kl: 0.01
  scale_up: 2.0
  scale_down: 0.5
  kl_tolerance_high: 1.5
  kl_tolerance_low: 0.5

buffer:
  type: RolloutBuffer
  config:
    buffer_size: 256
    device: *device

schedule:
  type: OnPolicySchedule
  config:
    unit: timestep
    units: 5000000
    learn_unit: timestep
    learn_units: 8192  # 256 * 32 envs
    batch_size: 8192
    learning_epochs: 10
    seed: *seed

renderer:
  render_freq: 5000 # episodes
  save_dir: *save_dir

callbacks:
  - type: WandbCallback
    config: {project_name: FetchPickAndPlaceDense-v4}