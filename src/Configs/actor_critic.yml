device: &device cuda
seed: &seed 42
save_dir: &save_dir E:/Documents/Programming/Projects/Reinforcement/PhoenX_RL/src/Trained_Models/LunarLanderContinuous-v3_test/ActorCritic/
log_level: INFO

agent:
  type: ActorCritic
  config:
    discount: 0.99
    entropy_coefficient: &entropy_coefficient 0.00001
    gae_coefficient: 1.0
    policy_grad_clip: 0.5
    value_grad_clip: 0.5
    value_coef: 0.5
    bootstrap_truncations: true
    log_level: DEBUG
    _diag_freq: 100

env:
  type: gymnasium # "isaacsim" or "gymnasium"
  config:
    # cfg: "isaaclab_tasks.manager_based.classic.cartpole.cartpole_env_cfg:CartpoleEnvCfg"
    cfg: LunarLanderContinuous-v3
    num_envs: 16
    # wrappers: [{"type": "OneHotObservationWrapper", "params": {}}]
    wrappers: []
    render_mode: null
    seed: *seed
    obs_key: null
    goal_key: null
    ach_goal_key: null

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 64, kernel: default, kernel_params: {}}
      - type: tanh
      - type: dense
        params: {units: 64, kernel: default, kernel_params: {}}
      - type: tanh
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: 0.0001}}
    distribution: normal
    # temperature: 2.0
    device: *device

  value:
    layer_config:
      - type: dense
        params: {units: 64, kernel: default, kernel_params: {}}
      - type: tanh
      - type: dense
        params: {units: 64, kernel: default, kernel_params: {}}
      - type: tanh
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: 0.0001}}
    device: *device

normalizers:
  advantage:
    type: BatchNorm
    config:
      momentum: 0.99
      clip_value: 10.0
      device: *device
  state:
    type: RunningNorm
    config:
      momentum: 0.99
      clip_value: 10.0
      warmup_steps: 1000
      device: *device
      log_level: INFO
      # kwargs
      # _diag_freq: 100

# entropy_schedule:
#   schedule_type: "linear"
#   steps: 1000000
#   start_value: *entropy_coefficient
#   end_value: 0.0001

buffer:
  type: RolloutBuffer
  config:
    buffer_size: 64
    device: *device

schedule:
  type: OnPolicySchedule
  config:
    unit: episode
    num_units: 5000
    learn_unit: timestep
    num_learn_units: 1024
    seed: *seed

renderer:
  render_freq: 1000
  save_dir: *save_dir

callbacks:
  - type: WandbCallback
    config: {project_name: LunarLanderContinuous-v3}