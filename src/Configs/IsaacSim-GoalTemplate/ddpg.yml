# DDPG + HER template for a goal-conditioned Isaac Lab (Isaac Sim) environment.
#
# Copy this folder, rename it to your task, and fill in the env `cfg` below.
#
# REQUIRED on the Isaac Lab side (in your ManagerBasedRLEnvCfg.ObservationsCfg):
#   Define three *concatenated* observation groups whose names match the keys
#   below (obs_key / goal_key / ach_goal_key):
#     - policy        : the agent observation WITHOUT the desired goal
#                       (achieved-goal terms may live here, like Fetch's `observation`)
#     - desired_goal  : the target/goal term(s)
#     - achieved_goal : the currently-achieved goal term(s)
#   Constraint: len(achieved_goal) == len(desired_goal) (the buffer allocates all
#   goal tensors from a single goal shape, and compute_reward needs matching dims).
#
#   Make your RewardManager produce the SAME sparse reward the wrapper recomputes
#   for HER relabeling, i.e. 0 if ||achieved - desired|| <= distance_threshold
#   else -1, using the same `distance_threshold` set in the env config below.
#   If the online and relabeled rewards differ, HER training degrades.

device: &device cuda
save_dir: &save_dir E:/Documents/Programming/Projects/Reinforcement/PhoenX_RL/src/Trained_Models/IsaacSim-GoalTemplate/DDPG/
log_level: INFO

schedule:
  stop_unit: timestep
  stop_units: &stop_units 5000000
  learn_every_unit: episode
  learn_every: 16
  updates_per_learn: 40
  batch_size: 512
  warmup_steps: 20000
  seed: &seed 42

agent:
  type: DDPG
  config:
    name: DDPG
    policy:
      layer_config:
        - type: dense
          params: {units: 256, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
        - type: relu
        - type: dense
          params: {units: 256, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
        - type: relu
        - type: dense
          params: {units: 256, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
        - type: relu
      output_config:
        - type: dense
          params: {kernel: uniform, kernel_params: {a: -0.003, b: 0.003}}
      optimizer_params: {type: Adam, params: {lr: &policy_lr 1.0e-3}}
      device: *device
    critic:
      layer_config: []
      merged_config:
        - type: dense
          params: {units: 256, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
        - type: relu
        - type: dense
          params: {units: 256, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
        - type: relu
        - type: dense
          params: {units: 256, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
        - type: relu
      output_config:
        - type: dense
          params: {kernel: uniform, kernel_params: {a: -0.003, b: 0.003}}
      optimizer_params: {type: Adam, params: {lr: &critic_lr 1.0e-3}}
      device: *device
    discount: 0.98
    tau: 0.05
    action_epsilon: 0.2
    state_normalizer:
      type: RunningNorm
      config:
        name: DDPG.StateNormalizer
        clip_value: 5.0
        device: *device
        log_level: DEBUG
        _diag_freq: 10000
    noise:
      type: NormalNoise
      config:
        stddev: &noise_stddev 0.1
    noise_clip: 0.5
    policy_grad_clip: 40.0
    critic_grad_clip: 40.0
    N: &n 3
    log_level: DEBUG
    _diag_freq: 1000

env:
  type: isaacsim # "isaacsim" or "gymnasium" or "envpool"
  config:
    # module_path:ClassName of your goal-conditioned ManagerBasedRLEnvCfg
    cfg: "isaaclab_tasks.manager_based.manipulation.reach.config.franka.joint_pos_env_cfg:FrankaReachEnvCfg"
    num_envs: 16 # Isaac Sim can run far more in parallel; HER relabels per-env, so scale up gradually.
    obs_key: &obs_key policy
    goal_key: &goal_key desired_goal
    ach_goal_key: &ach_goal_key achieved_goal
    distance_threshold: &distance_threshold 0.05 # MUST match your RewardManager's success threshold
    wrappers: [{"type": "VectorNStepReward", "params": {"n": *n, "obs_key": *obs_key, "goal_key": *goal_key, "ach_goal_key": *ach_goal_key}}]
    render_mode: headless
    seed: *seed

buffer:
  type: PrioritizedReplayBuffer
  config:
    buffer_size: 1000000
    alpha: 0.6
    beta_start: 0.4
    beta_iter: 500000
    priority: rank
    epsilon: 1.0e-6
    N: *n
    hindsight:
      strategy: future
      num_goals: 4
      output_format: n_step
      N: *n
      gamma: 0.99
      device: *device
      relabel_terminations: false
      future_lo: inclusive
      goal_pool: null
    device: *device

renderer:
  render_freq: 500 # episodes
  save_dir: *save_dir

callbacks:
  - type: "WandbCallback"
    config: {project_name: "IsaacSim-GoalTemplate"}
