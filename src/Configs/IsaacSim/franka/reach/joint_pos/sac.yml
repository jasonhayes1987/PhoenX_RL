    #     }
    #     optimizer_params: {type: Adam, params: {lr: 0.001}}
    #     reward_weight: &im_reward_weight 0.1
    #     reward_scheduler:
    #       schedule_type: linear
    #       steps: *stop_units
    #       start_value: *im_reward_weight
    #       end_value: 0.0
