#DDPG tuned for LunarLanderContinuous-v3

device: &device "cuda"
save_dir: &save_dir ./Trained_Models/LunarLanderContinuous-v3/DDPG/
log_level: INFO

schedule:
  stop_unit: timestep
  stop_units: &stop_units 1000000
  learn_every_unit: timestep
  learn_every: 64
  updates_per_learn: 1
  batch_size: 256
  warmup_steps: 10000
  seed: &seed 42

agent:
  type: DDPG
  config:
    discount: 0.99
    tau: 0.05
    action_epsilon: 0.0
    noise_clip: 0.3
    policy_grad_clip: 40.0
    critic_grad_clip: 40.0
    N: &n 3
    log_level: DEBUG
    _diag_freq: 1000

env:
  type: "envpool" # "isaacsim" or "gymnasium" or "envpool"
  config:
    # cfg: "isaaclab_tasks.manager_based.classic.cartpole.cartpole_env_cfg:CartpoleEnvCfg"
    cfg: LunarLanderContinuous-v3
    num_envs: 64
    obs_key: &obs_key null
    goal_key: &goal_key null
    ach_goal_key: &ach_goal_key null
    wrappers: [{"type": "VectorNStepReward", "params": {"n": *n, "obs_key": *obs_key, "goal_key": *goal_key, "ach_goal_key": *ach_goal_key}}]
    render_mode: null
    seed: *seed

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 400, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
      - type: dense
        params: {units: 300, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: uniform, kernel_params: {a: -0.003, b: 0.003}}
    optimizer_params: {type: Adam, params: {lr: &policy_lr 1.4e-4}}
    device: *device

  critic:
    layer_config:
      - type: dense
        params: {units: 400, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
    merged_config:
      - type: dense
        params: {units: 300, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: uniform, kernel_params: {a: -0.003, b: 0.003}}
    optimizer_params: {type: Adam, params: {lr: &critic_lr 1.4e-3}}
    device: *device

# policy_lr_schedule:
#   schedule_type: "cosine"
#   steps: &stop_units
#   start_value: *policy_lr
#   end_value: 1.0e-4

# critic_lr_schedule:
#   schedule_type: "cosine"
#   steps: &stop_units
#   start_value: *critic_lr
#   end_value: 1.0e-4

normalizers:
  state:
    type: RunningNorm
    config:
      clip_value: 10.0
      device: *device
      log_level: DEBUG
      # kwargs
      _diag_freq: 10000
  reward:
    type: RewardNorm
    config:
      gamma: 0.99
      clip_value: 10.0
      device: *device
      log_level: DEBUG
      # kwargs
      _diag_freq: 10000

# replay_buffer:
