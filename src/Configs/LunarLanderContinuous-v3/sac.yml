# SAC tuned for LunarLanderContinuous-v3
# Hyperparameters from Stable-Baselines3 RL Zoo (DLR-RM/rl-baselines3-zoo)
#   ref: https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/sac.yml
#   verified mean reward: ~252 ± 72 (env solved at 200)

device: &device "cuda"
save_dir: &save_dir ./Trained_Models/LunarLanderContinuous-v3/SAC/
log_level: INFO

schedule:
  stop_unit: timestep
  stop_units: &stop_units 1000000          # n_timesteps: 1e6
  learn_every_unit: timestep
  learn_every: 64                          # train_freq (learn call per env step)
  updates_per_learn: 1                    # gradient_steps
  batch_size: 2048
  warmup_steps: 10000                     # learning_starts
  seed: &seed 42

agent:
  type: SAC
  config:
    discount: 0.99                        # gamma
    tau: 0.01                             # RL Zoo override for LunarLanderContinuous (default 0.005)
    entropy_coefficient: 1.0              # initial alpha; tuned automatically
    auto_entropy_tuning: true             # ent_coef: 'auto'
    entropy_lr: 0.0003
    policy_grad_clip: 1.0
    critic_grad_clip: 1.0
    N: &n 1                               # 1-step returns (standard SAC)
    log_level: DEBUG
    _diag_freq: 1000

env:
  type: envpool
  config:
    cfg: LunarLanderContinuous-v3
    num_envs: 64                           # RL Zoo recipe assumes single env
    obs_key: &obs_key null
    goal_key: &goal_key null
    ach_goal_key: &ach_goal_key null
    wrappers: [{"type": "VectorNStepReward", "params": {"n": *n, "obs_key": *obs_key, "goal_key": *goal_key, "ach_goal_key": *ach_goal_key}}]
    render_mode: null
    seed: *seed

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 400, kernel: default, kernel_params: {}}    # net_arch: [400, 300]
      - type: relu
      - type: dense
        params: {units: 300, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &policy_lr 0.00073}}  # lin_7.3e-4
    distribution: normal
    device: *device

  critic:
    layer_config:
      - type: dense
        params: {units: 400, kernel: default, kernel_params: {}}
      - type: relu
    merged_config:
      - type: dense
        params: {units: 300, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &critic_lr 0.00073}}
    device: *device

  critic_b:
    layer_config:
      - type: dense
        params: {units: 400, kernel: default, kernel_params: {}}
      - type: relu
    merged_config:
      - type: dense
        params: {units: 300, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: &critic_b_lr 0.00073}}
    device: *device

# RL Zoo uses `lin_7.3e-4` (linear decay 7.3e-4 -> 0 over training)
policy_lr_schedule:
  schedule_type: "linear"
  steps: *stop_units
  start_value: *policy_lr
  end_value: 0.0

critic_lr_schedule:
  schedule_type: "linear"
  steps: *stop_units
  start_value: *critic_lr
  end_value: 0.0

critic_b_lr_schedule:
  schedule_type: "linear"
  steps: *stop_units
  start_value: *critic_b_lr
  end_value: 0.0

normalizers:
  state:
    type: RunningNorm
    config:
      clip_value: 10.0
      warmup_steps: 5000
      device: *device
      log_level: DEBUG
      _diag_freq: 10000

buffer:
  type: ReplayBuffer
  config:
    buffer_size: 1000000                  # buffer_size: 1e6
    N: *n
    device: *device

renderer:
  render_freq: 500
  save_dir: *save_dir

callbacks:
  - type: "WandbCallback"
    config: {project_name: "LunarLanderContinuous-v3"}
