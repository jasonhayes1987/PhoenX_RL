normalizers:
  state:
    type: RunningNorm
    config:
      clip_value: 10.0
      warmup_steps: 5000
      device: *device
      log_level: DEBUG
      # kwargs
      _diag_freq: 10000
  # reward:
  #   type: RewardNorm
  #   config:
  #     gamma: 0.99
  #     clip_value: 10.0
  #     device: *device
  #     log_level: DEBUG
  #     # kwargs
  #     _diag_freq: 10000

