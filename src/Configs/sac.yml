callbacks:
  - type: "WandbCallback"
    config: {project_name: "LunarLander-v3"}

train_config:
  load_weights: false
  num_episodes: 2000
  steps_per_learn: 1
  render_freq: 100
  seed: *seed

test_config:
  load_weights: true
  num_episodes: 20
  render_freq: 1
  seed: 42