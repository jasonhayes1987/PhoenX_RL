device: &device "cuda"
save_dir: &save_dir ./Trained_Models/LunarLanderContinuous-v3/SAC/
log_level: INFO

schedule:
  stop_unit: timestep
  stop_units: 500000
  learn_every_unit: timestep
  learn_every: 64
  seed: &seed 42

agent:
  type: SAC
  config:
    discount: 0.99
    tau: 0.005
    entropy_coefficient: 0.05
    auto_entropy_tuning: false
    entropy_lr: 0.0003
    policy_grad_clip: 1.0
    critic_grad_clip: 1.0
    warmup: 10000
    N: &n 3
    log_level: DEBUG
    _diag_freq: 1000

env:
  type: envpool # "isaacsim" or "gymnasium" or "envpool"
  config:
    # cfg: "isaaclab_tasks.manager_based.classic.cartpole.cartpole_env_cfg:CartpoleEnvCfg"
    cfg: LunarLanderContinuous-v3
    num_envs: 64
    obs_key: &obs_key null
    goal_key: &goal_key null
    ach_goal_key: &ach_goal_key null
    wrappers: [{"type": "VectorNStepReward", "params": {"n": *n, "obs_key": *obs_key, "goal_key": *goal_key, "ach_goal_key": *ach_goal_key}}]
    render_mode: null
    seed: *seed

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: 0.0003}}
    distribution: normal
    device: *device

  critic:
    layer_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    merged_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: 0.0003}}
    device: *device

  critic_b:
    layer_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    merged_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: 0.0003}}
    device: *device

# policy_lr_schedule:
