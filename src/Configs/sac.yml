n: &n 1 # n-step reward
obs_key: &obs_key null
goal_key: &goal_key null
achieved_goal_key: &achieved_goal_key null
device: &device "cuda"
seed: &seed 42
save_dir: "E:/Documents/Programming/Projects/Reinforcement/PhoenX_RL/src/Trained_Models/LunarLander-v3_2/SAC/"
log_level: "info"

agent:
  discount: 0.99
  tau: 0.005
  alpha: 0.05
  auto_entropy_tuning: false
  alpha_lr: 0.0003
  batch_size: 256
  grad_clip: 1.0
  warmup: 10000
  N: *n

env:
  type: "gymnasium" # "isaacsim" or "gymnasium"
  config:
    # cfg: "isaaclab_tasks.manager_based.classic.cartpole.cartpole_env_cfg:CartpoleEnvCfg"
    cfg: "LunarLander-v3"
    num_envs: 4
    wrappers: [{"type": "VectorNStepReward", "params": {"n": *n, "obs_key": *obs_key, "goal_key": *goal_key, "ach_goal_key": *achieved_goal_key}}]
    render_mode: null
    seed: *seed
    obs_key: *obs_key
    goal_key: *goal_key

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: 0.0003}}
    distribution: categorical
    obs_key: *obs_key
    device: *device

  critic_a:
    layer_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: 0.0003}}
    obs_key: *obs_key
    device: *device

  critic_b:
    layer_config:
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
      - type: dense
        params: {units: 256, kernel: default, kernel_params: {}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: default, kernel_params: {}}
    optimizer_params: {type: Adam, params: {lr: 0.0003}}
    obs_key: *obs_key
    device: *device

