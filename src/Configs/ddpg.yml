schedule:
  type: OffPolicySchedule
  config:
    unit: timestep
    units: 100000
    cycles: 10
    episodes: 10
    updates: 10
    batch_size: 256
    seed: *seed

renderer:
  render_freq: 5000 # episodes
  save_dir: *save_dir

callbacks:
  - type: "WandbCallback"
    config: {project_name: "LunarLanderContinuous-v3"}