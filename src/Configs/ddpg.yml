device: &device "cuda"
seed: &seed 42
save_dir: &save_dir ./Trained_Models/LunarLanderContinuous-v3/DDPG/
log_level: INFO

agent:
  type: DDPG
  config:
    discount: 0.99
    tau: 0.005
    action_epsilon: 0.2
    noise_clip: 0.5
    policy_grad_clip: 40.0
    value_grad_clip: 40.0
    warmup: 1000
    N: &n 3

env:
  type: "envpool" # "isaacsim" or "gymnasium" or "envpool"
  config:
    # cfg: "isaaclab_tasks.manager_based.classic.cartpole.cartpole_env_cfg:CartpoleEnvCfg"
    cfg: "LunarLanderContinuous-v3"
    num_envs: 8
    obs_key: &obs_key null
    goal_key: &goal_key null
    ach_goal_key: &ach_goal_key null
    wrappers: [{"type": "VectorNStepReward", "params": {"n": *n, "obs_key": *obs_key, "goal_key": *goal_key, "ach_goal_key": *ach_goal_key}}]
    render_mode: null
    seed: *seed

models:
  policy:
    layer_config:
      - type: dense
        params: {units: 400, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
      - type: dense
        params: {units: 300, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: uniform, kernel_params: {a: -0.003, b: 0.003}}
    optimizer_params: {type: Adam, params: {lr: &policy_lr 0.0001}}
    device: *device

  critic:
    layer_config:
      - type: dense
        params: {units: 400, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
    merged_config:
      - type: dense
        params: {units: 300, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
    output_config:
      - type: dense
        params: {kernel: uniform, kernel_params: {a: -0.003, b: 0.003}}
    optimizer_params: {type: Adam, params: {lr: &critic_lr 0.001}}
    device: *device

policy_lr_schedule:
  schedule_type: "cosine"
  steps: 100000
  start_value: *policy_lr
  end_value: 1.0e-4

value_lr_schedule:
  schedule_type: "cosine"
  steps: 100000
  start_value: *critic_lr
  end_value: 1.0e-4

normalizers:
  state:
    type: RunningNorm
    config:
      clip_value: 10.0
      warmup_steps: 5000
      device: *device
      _diag_freq: 10240
  reward:
    type: RewardNorm
    config:
      gamma: 0.99
      clip_value: 10.0
      device: *device
      _diag_freq: 10240

