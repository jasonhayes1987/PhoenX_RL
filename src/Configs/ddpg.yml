buffer:
  type: ReplayBuffer
  config:
    buffer_size: 1000000
    N: *n
    device: *device

noise:
  type: NormalNoise
  config:
    stddev: &noise_stddev 1.0

noise_schedule:
  schedule_type: linear
  steps: 100000
  start_value: *noise_stddev
  end_value: 0.1

