n: &n 3 # n-step reward
obs_key: &obs_key 'policy'
goal_key: &goal_key null
achieved_goal_key: &achieved_goal_key null
device: &device "cuda"
seed: &seed 100
save_dir: "E:/Documents/Programming/Projects/Reinforcement/PhoenX_RL/src/Trained_Models/Isaac_Cartpole_N3/DDPG/"
log_level: "info"

agent:
  discount: 0.99
  tau: 0.005
  action_epsilon: 0.2
  batch_size: 128
  grad_clip: 40.0
  warmup: 100
  N: *n

env:
  type: "isaacsim" # "isaacsim" or "gymnasium"
  config:
    cfg: "isaaclab_tasks.manager_based.classic.cartpole.cartpole_env_cfg:CartpoleEnvCfg"
    # cfg: "LunarLanderContinuous-v3"
    num_envs: 16
    wrappers: [{"type": "VectorNStepReward", "params": {"n": *n, "obs_key": *obs_key, "goal_key": *goal_key, "ach_goal_key": *achieved_goal_key}}]
    render_mode: null
    seed: *seed
    obs_key: *obs_key
    goal_key: *goal_key

models:
  actor:
    layer_config:
      - type: dense
        params: {units: 400, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
      - type: dense
        params: {units: 300, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
    output_layer_kernel:
      - type: dense
        params: {kernel: uniform, kernel_params: {a: -0.003, b: 0.003}}
    optimizer_params: {type: Adam, params: {lr: 0.001}}
    obs_key: *obs_key
    device: *device

  critic:
    state_layers:
      - type: dense
        params: {units: 400, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
    merged_layers:
      - type: dense
        params: {units: 300, kernel: variance_scaling, kernel_params: {scale: 1.0, mode: fan_in, distribution: uniform}}
      - type: relu
    output_layer_kernel:
      - type: dense
        params: {kernel: uniform, kernel_params: {a: -0.003, b: 0.003}}
    optimizer_params: {type: Adam, params: {lr: 0.001}}
    obs_key: *obs_key
    device: *device

normalizers:
  state:
    momentum: 0.99
    update_freq: 200
    clip_range: 5.0

replay_buffer:
  class_name: ReplayBuffer
  config:
    buffer_size: 1000000
    N: *n
    obs_key: *obs_key
    goal_key: *goal_key
    device: "cpu"

noise:
  type: NormalNoise
  params: {stddev: 0.1}

callbacks:
  - type: "WandbCallback"
    config: {project_name: "Isaac_Cartpole-v1"}

train_config:
  load_weights: false
  num_episodes: 1000
  steps_per_learn: 1
  render_freq: 0
  seed: 42

test_config:
  load_weights: true
  num_episodes: 20
  render_freq: 1
  seed: 42