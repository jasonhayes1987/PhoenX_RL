#PPO tuned for LunarLanderContinuous-v3

#TODO: Add ICM

device: &device cuda
save_dir: &save_dir ./Trained_Models/LunarLanderContinuous/PPO/
log_level: INFO

schedule:
  stop_unit: timestep
  stop_units: &stop_units 2000000
  learn_every_unit: timestep
  learn_every: 8192
  mini_batch_size: 256
  learning_epochs: 5
  seed: &seed 42

agent:
  type: PPO
  config:
    # A flat Box observation needs no per-modality encoder, so there is no
    # root and no trunk: each head keeps its own body and its own
    # optimizer.
    model:
      device: *device
      roots: null
      trunk: null
      branches:
        policy:
          type: StochasticContinuousHead
          layer_config:
            - type: dense
              params: {units: 64, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
            - type: tanh
            - type: dense
              params: {units: 64, kernel: orthogonal, kernel_params: {gain: 1.41421356}}
            - type: tanh
          output_config:
            - type: dense
              params: {kernel: orthogonal, kernel_params: {gain: 0.01}}
          optimizer_params: {type: Adam, params: {lr: &policy_lr 3.0e-4}}
          distribution: normal
          lr_scheduler:
            schedule_type: "linear"
            steps: *stop_units
            start_value: *policy_lr
            end_value: 1.0e-5

        value:
          type: ValueHead
          layer_config:
            - type: dense
              params: {units: 64, kernel: default, kernel_params: {}}
            - type: relu
            - type: dense
              params: {units: 64, kernel: default, kernel_params: {}}
            - type: relu
          output_config:
            - type: dense
              params: {kernel: default, kernel_params: {}}
          optimizer_params: {type: Adam, params: {lr: &value_lr 3.0e-4}}
    discount: 0.99
    gae_coefficient: 0.95
    entropy_coefficient: &entropy_coefficient 0.02
    auto_entropy_tuning: false
    entropy_lr: 1.0e-2
    target_entropy_scale: 0.98
    kl_coefficient: 0.0
    policy_clip: &policy_clip 0.2
    policy_grad_clip: 0.5
    value_clip: &value_clip 0.2
    value_grad_clip: 0.5
    value_coef: 0.5
    reward_clip: .inf
    bootstrap_truncations: true
    log_level: DEBUG
    _diag_freq: 10
    advantage_normalizer:
      type: BatchNorm
      config:
        clip_value: 10.0
        device: *device
        log_level: DEBUG
        # kwargs
        _diag_freq: 10240
    state_normalizer:
      type: RunningNorm
      config:
        clip_value: 10.0
        device: *device
        log_level: DEBUG
        # kwargs
        _diag_freq: 10240
    reward_normalizer:
      type: RewardNorm
      config:
        gamma: 0.99
        clip_value: 10.0
        device: *device
        log_level: DEBUG
        # kwargs
        _diag_freq: 10240
    entropy_schedule:
      schedule_type: "cosine"
      steps: *stop_units
      start_value: *entropy_coefficient
      end_value: 0.001
    # temperature_schedule:
    #   schedule_type: "cosine"
    #   steps: *stop_units
    #   start_value: *temperature
    #   end_value: 1.0
    # policy_clip_schedule:
    #   schedule_type: "linear"
    #   steps: *stop_units
    #   start_value: *policy_clip
    #   end_value: 0.01
    # value_clip_schedule:
    #   schedule_type: "linear"
    #   steps: *stop_units
    #   start_value: *value_clip
    #   end_value: 0.01
    # kl_adapter:
    #   initial_beta: 0.5
    #   target_kl: 0.01
    #   scale_up: 2.0
    #   scale_down: 0.5
    #   kl_tolerance_high: 1.5
    #   kl_tolerance_low: 0.5

env:
  type: envpool # "isaacsim" or "gymnasium" or "envpool"
  config:
    # cfg: "isaaclab_tasks.manager_based.classic.cartpole.cartpole_env_cfg:CartpoleEnvCfg"
    cfg: LunarLanderContinuous-v3
    num_envs: 64
    obs_key: null
    goal_key: null
    ach_goal_key: null
    # wrappers: [{"type": "OneHotObservationWrapper", "params": {}}]
    wrappers: []
    render_mode: null
    seed: *seed

buffer:
  type: RolloutBuffer
  config:
    buffer_size: 128
    device: *device

renderer:
  render_freq: 1000
  save_dir: *save_dir

callbacks:
  - type: WandbCallback
    config: {project_name: LunarLanderContinuous-v3}