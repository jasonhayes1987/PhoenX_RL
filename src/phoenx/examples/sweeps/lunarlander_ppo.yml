# =============================================================================
# LunarLanderContinuous-v3 PPO multi-phase Ray Tune sweep.
#
# Three phases run in series, each promoting its winner into the next:
#   1. architecture  - random search + ASHA over branches.policy /
#                       branches.value depth (block grammar), plus one plain
#                       dotted search_space key (an output-layer init gain).
#   2. optimizers     - Optuna over each branch's own learning rate.
#   3. refine         - random search over PPO's core training scalars.
#
# num_samples / stop_units below are kept small so this sweep finishes in a
# few minutes on a CPU for a smoke test; raise both substantially (stop_units
# to LunarLanderContinuous-v3/ppo.yml's own 2_000_000, num_samples per phase
# into the dozens) for a real search.
#
# Run it:
#   phoenx-tune --config lunarlander_ppo.yml
#
# Validate the schema only (no Ray, no training):
#   phoenx-tune --config lunarlander_ppo.yml --validate-only
#
# Resume from a later phase once earlier phases have completed and written
# their best_config.yml:
#   phoenx-tune --config lunarlander_ppo.yml --from-phase optimizers
#
# This sweep does not use PBT (Population Based Training); scheduler.type:
# pbt is rejected in this delivery pass (it needs checkpoint plumbing).
# =============================================================================

base_config: LunarLanderContinuous-v3/ppo.yml

# Constant for every trial of every phase.
overrides:
  schedule.stop_units: 300000
  log_level: ERROR

# Inherited by every phase; any phase may override any key.
defaults:
  metric: avg_reward
  mode: max
  resources: {cpu: 1, gpu: 0}
  max_concurrent_trials: 2
  report: {every: 20000, unit: timestep}
  auto_learn_every: true
  # Add a `wandb: {project: my-project}` block to a phase (or here, to apply
  # to every phase) to get one grouped, fully-named W&B run per trial. Left
  # out by default so this example never needs W&B credentials to run.

# Reusable block library referenced by the architecture phase.
blocks:
  dense_block:
    layers:
      - type: dense
        params:
          units: {dist: choice, values: [64, 128, 256]}
          kernel: {dist: choice, values: [orthogonal, default]}
      - type: {dist: choice, values: [relu, tanh]}

phases:
  - name: architecture
    architecture:
      branches.policy:
        depth: {dist: randint, lower: 1, upper: 4}
        blocks: [dense_block]
      branches.value:
        depth: {dist: randint, lower: 1, upper: 4}
        blocks: [dense_block]
    search_space:
      # A plain dotted config path can be swept alongside architecture keys
      # in the same phase; this is the policy head's output-layer init gain.
      agent.config.model.branches.policy.output_config.0.params.kernel_params.gain:
        {dist: choice, values: [0.01, 0.1, 1.0]}
    tune:
      num_samples: 6
      search_alg: {type: random}
      # max_t must be >= grace_period and matches overrides.schedule.stop_units,
      # since time_attr is the timestep count a trial reports.
      scheduler: {type: asha, time_attr: timestep, grace_period: 40000, max_t: 300000, reduction_factor: 2}
      stop: [{type: TrialPlateauStopper, metric: avg_reward, std: 5.0, num_results: 5}]
    promote: {mode: best, seed_next: 2}

  - name: optimizers
    optimizers:
      branches.policy: {lr: {dist: loguniform, low: 1.0e-5, high: 1.0e-3}}
      branches.value:  {lr: {dist: loguniform, low: 1.0e-5, high: 1.0e-3}}
    tune:
      num_samples: 8
      search_alg: {type: optuna}
      # max_t must be >= grace_period and matches overrides.schedule.stop_units,
      # since time_attr is the timestep count a trial reports.
      scheduler: {type: asha, time_attr: timestep, grace_period: 40000, max_t: 300000, reduction_factor: 2}
    promote: {mode: best, seed_next: 3}

  - name: refine
    search_space:
      agent.config.discount:            {dist: uniform, low: 0.95, high: 0.999}
      agent.config.gae_coefficient:     {dist: uniform, low: 0.9, high: 0.99}
      agent.config.entropy_coefficient: {dist: loguniform, low: 1.0e-4, high: 0.05}
      agent.config.policy_clip:         {dist: uniform, low: 0.1, high: 0.4}
      schedule.learning_epochs:         {dist: randint, lower: 3, upper: 11}
    tune:
      num_samples: 8
      search_alg: {type: random}       # no scheduler declared here -> FIFO
    promote: {mode: best}
