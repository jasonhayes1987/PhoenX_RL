name: rl_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Compiler toolchain (needed for building C++ extensions like box2d-py)
  - cxx-compiler
  - c-compiler
  - make
  - cmake=3.27  # Use CMake 3.x (4.x doesn't support projects requiring < 3.5 like egl_probe)
  - pylint
  - pytest
  - numpy
  - pandas
  # - numba
  - umap-learn
  - pynndescent
  - matplotlib
  - seaborn
  - scikit-learn
  - swig
  - astunparse
  - hypothesis
  - psutil
  - pyyaml
  - requests
  - setuptools
  - typing-extensions>=4.8.0
  - sympy
  - filelock
  - networkx
  - jinja2
  - fsspec
  - packaging
  - lark
  - ipykernel
  - ale-py
  - flask
  - dash
  - natsort
  - ffmpeg
  - mpi4py
  - dash-bootstrap-components
  - mujoco>=2.2.0,<3.2.0
  - python-dotenv
  - python-dotenv-with-cli
  - ray-all
  - ray-tune
  - optuna
  - hyperopt
  # - opencv==4.11
  # - moviepy
  - pip:
    # Core dependencies
    - expecttest!=0.2.0
    - optree>=0.9.1
    - ale-py
    - autorom
    - wandb
    - types-dataclasses
    - gymnasium[all]==1.2.0
    - decorator==4.0.2
    # - mcp
    - ipywidgets
    # Note: PyTorch, Isaac Sim, and Gymnasium Robotics are installed separately
    # via setup script because they require special index URLs or GitHub installs
    # See setup_complete.sh for details
